name: CortexHeal CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cortexheal
          POSTGRES_PASSWORD: cortexpassword
          POSTGRES_DB: cortexheal_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,langgraph]
        
    - name: Run Tests
      env:
        DATABASE_URL: postgresql://cortexheal:cortexpassword@localhost:5432/cortexheal_db
      run: |
        pytest tests/
        
    - name: Run Database Migrations
      env:
        DATABASE_URL: postgresql://cortexheal:cortexpassword@localhost:5432/cortexheal_db
      run: |
        alembic upgrade head
        
    - name: Test Package Build
      run: |
        python -m pip install build
        python -m build
        
    - name: Test Docker Build
      run: |
        docker build -t cortexheal:test .

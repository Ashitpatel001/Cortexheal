# ═══════════════════════════════════════════════════════════
# CortexHeal — Production Docker Compose
# ═══════════════════════════════════════════════════════════
# This file is for bare-metal / self-hosted production deployments.
# The original docker-compose.yml is preserved for local development.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites (human steps — see DEPLOYMENT.md):
#   1. Create /opt/cortexheal/data/postgres on the host
#   2. Create /opt/cortexheal/backups on the host
#   3. Copy .env.production.example → .env.production and fill real values
# ═══════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: cortexheal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: cortexheal_db
    volumes:
      # Bind mount — survives container recreation, easy to back up from host
      - /opt/cortexheal/data/postgres:/var/lib/postgresql/data
    ports:
      # Only expose on loopback — Caddy reverse-proxies the API, not Postgres
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexheal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortexheal

  # ── Backend API ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Override DATABASE_URL to point at the Postgres container on the
      # Docker network (not localhost — containers resolve by service name)
      DATABASE_URL: postgresql://cortexheal:${POSTGRES_PASSWORD}@postgres:5432/cortexheal_db
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - cortexheal

  # ── Demo Runner (supervised) ──────────────────────────────
  demo-runner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://cortexheal:${POSTGRES_PASSWORD}@postgres:5432/cortexheal_db
      DEMO_ORG_ID: demo_public
    # Override the default CMD to run the demo worker instead of uvicorn
    command: ["python", "scripts/cron_demo_runner.py"]
    networks:
      - cortexheal

networks:
  cortexheal:
    driver: bridge

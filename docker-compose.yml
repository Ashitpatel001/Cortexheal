services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cortexheal
      POSTGRES_PASSWORD: cortexpassword
      POSTGRES_DB: cortexheal_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexheal"]
      interval: 5s
      timeout: 5s
      retries: 5

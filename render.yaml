services:
  - type: web
    name: cortexheal-api
    env: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cortexheal-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: cortexheal-demo-runner
    env: docker
    plan: free
    region: ohio
    dockerCommand: python scripts/cron_demo_runner.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cortexheal-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: cortexheal-db
    plan: free
    region: ohio
